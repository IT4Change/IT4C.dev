name: backend:test:typecheck

on: push

jobs:
  files-changed:
    name: Detect File Changes - typecheck
    runs-on: ubuntu-latest
    outputs:
      typecheck: ${{ steps.filter.outputs.typecheck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            typecheck:
              - '.github/workflows/**/*'
              - 'backend/**/*'

  typecheck:
    if: needs.files-changed.outputs.typecheck == 'true'
    name: Typecheck
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.3
        with:
          node-version-file: './.tool-versions'
      - name: Typecheck
        run: npm install && npm run typecheck
        working-directory: ./backend
