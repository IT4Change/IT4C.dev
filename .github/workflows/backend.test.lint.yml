name: backend:test:lint

on: push

jobs:
  files-changed:
    name: Detect File Changes - lint
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            lint:
              - '.github/workflows/**/*'
              - 'backend/**/*'

  lint:
    if: needs.files-changed.outputs.lint == 'true'
    name: Lint
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.3
        with:
          node-version-file: './.tool-versions'
      - name: Lint
        run: npm install && npm run lint
        working-directory: ./backend
